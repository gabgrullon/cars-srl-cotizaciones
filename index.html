<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>CARS Cotizaciones</title>
<link href="css/styles.css" rel="stylesheet"/>
</head>
<body>
<button aria-label="Dictar cotización" class="floating-mic-btn" id="floating-mic-btn" title="Dictar cotización" type="button">
<svg fill="none" stroke="currentColor" stroke-width="1.5" style="width:2rem;height:2rem;" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="mic-tooltip">Dictar cotización</span>
</button>
<div class="wrap">
<div class="header logoOnly">
<div class="logoBox cleanLogo">
<img alt="CARS Logo" onerror="this.style.display='none'; document.getElementById('logoText').style.display='block';" src="logo.png"/>
<div id="logoText" style="display:none;font-weight:bold;">CARS</div>
</div>
</div>
<div class="appTitle">Cotizaciones</div>
<div class="card hero-card">
<div class="section-title" style="justify-content:center;">
<label class="section-label" style="text-align:center;width:100%;">
        Dictado
      </label>
</div>
<textarea autocapitalize="sentences" autocomplete="off" id="dictado" inputmode="text" placeholder="Dicta o pega la cotización..."></textarea>
<div style="margin-top:10px">
<button class="btn primary-submit" onclick="parseDictation()" type="button">
    Procesar
  </button>
<button class="btn-secondary" onclick="clearAll()" style="width:100%;margin-top:10px;" type="button">
    Limpiar
  </button>
</div>
<div class="commandBar">
<button onclick="insertCommand('Cliente: ')" type="button">+ Cliente</button>
<button onclick="insertCommand('Vehículo: ')" type="button">+ Vehículo</button>
<button onclick="insertCommand('Fecha: ')" type="button">+ Fecha</button>
<button onclick="insertCommand('ITBIS: ')" type="button">+ ITBIS</button>
<button onclick="insertCommand('Observación: ')" type="button">+ Observación</button>
<button onclick="insertCommand('Artículo: ')" type="button">+ Artículo</button>
</div>
<p class="hint" id="voiceStatus">Micrófono listo.</p>
</div>
<div class="card review-area" id="infoCard">
<div class="section-title" style="justify-content:center;">
<label class="section-label" style="text-align:center;width:100%;">
      Información
    </label>
</div>
<div class="client-search-wrap">
<div class="client-search-row">
<div>
<label>Buscar cliente</label>
<input autocomplete="off" id="clienteBuscar" placeholder="Escribe nombre, RNC o teléfono"/>
</div>
<button class="btn-secondary save-client-btn" onclick="saveClientFromForm()" type="button">Guardar cliente</button>
</div>
<div class="client-results" id="clienteResultados"></div>
<div class="client-status" id="clienteStatus"></div>
</div>
<div class="grid">
<div><label>Cliente</label><input id="cliente"/></div>
<div><label>RNC</label><input id="rnc" placeholder="RNC o cédula"/></div>
</div>
<div style="margin-top:12px">
<label>Vehículo</label>
<input id="vehiculo" placeholder="Marca Modelo Año Color"/>
</div>
<div class="grid3" style="margin-top:12px">
<div><label>Fecha</label><input id="fecha" placeholder="DD/MM/YYYY"/></div>
<div><label>ITBIS</label><select id="itbis"><option value="false">No</option><option value="true">Sí, 18%</option></select></div>
<div><label>Tipo</label><select id="prueba"><option value="false">Cotización real</option><option value="true">Prueba</option></select></div>
</div>
<div style="margin-top:12px"><label>Observación</label><textarea id="observacion" style="min-height:70px"></textarea></div>
</div>
<div class="card review-area" id="itemsCard">
<div class="section-title" style="justify-content:center;">
<label class="section-label" style="text-align:center;width:100%;">
      Artículos
    </label>
</div>
<div id="items"></div>
<button class="btn primary-submit" onclick="addItem()" type="button">
  + Agregar artículo
</button>
</div>
<div class="card review-area" id="totalsCard">
<div class="section-title" style="justify-content:center;">
<label class="section-label" style="text-align:center;width:100%;">
      Resumen
    </label>
</div>
<div class="totals">
<div><span>Subtotal</span><span id="subtotal">RD$0.00</span></div>
<div><span>ITBIS</span><span id="itbisMonto">RD$0.00</span></div>
<div class="total"><span>Total</span><span id="total">RD$0.00</span></div>
</div>
<div class="actions" style="margin-top:14px">
<button class="btn primary-submit" onclick="submitQuote()">Crear cotización</button>
</div>
<div id="result" style="margin-top:12px"></div>
</div>
<div class="card review-area" id="historyCard">
<div class="section-title" style="justify-content:center;">
<label class="section-label" style="text-align:center;width:100%;">
      Historial
    </label>
</div>
<div class="actions" style="margin-top:14px">
<button class="btn primary-submit" onclick="loadQuoteHistory()" type="button">
    Historial
  </button>
</div>
<div class="history-list" id="historyResult"></div>
</div>
</div>
<script src="js/app.js"></script>
</body>
</html>
